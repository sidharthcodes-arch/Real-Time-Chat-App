services:
  - type: web
    name: laravel-chat
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
      php artisan migrate --force
      php artisan config:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: BROADCAST_CONNECTION
        value: reverb

  - type: worker
    name: laravel-reverb
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan reverb:start --host=0.0.0.0 --port=8080